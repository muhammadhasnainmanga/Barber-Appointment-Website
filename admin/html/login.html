<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — SZCUTZ</title>
    <link rel="stylesheet" href="../css/login.css" />
    <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

  <main class="login-page">
    <div class="login-card">
      <a href="../../frontend/home/html/home.html" class="brand">
           <img src="../../assets/logo_image/logo_refine_pro_max-removebg.png" alt="SZCUTZ" class="login-logo" />
      </a>
      <span class="eyebrow">Admin</span>
      <h1>Welcome Back</h1>
      <p class="login-subtext">Log in to manage bookings, services, and availability.</p>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Your username" required autocomplete="new-password" />
        </div>
        <div class="form-group password-field">
          <label for="password">Password</label>
          <div class="password-input-wrap">
            <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="new-password" />
            <button type="button" class="toggle-password" aria-label="Toggle confirm password visibility" data-target="password">
              <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.39 21.39 0 0 1 5.06-6.94"></path><path d="M1 1l22 22"></path><path d="M9.88 9.88A3 3 0 0 0 14.12 14.12"></path></svg>
            </button>
          </div>
        </div>
        <!-- <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="new-password" />
        </div> -->

        <div class="form-message" id="formMessage" role="alert" hidden></div>

        <button type="submit" class="btn btn-primary login-submit">Log In</button>
      </form>
    </div>
  </main>

  <script src="../js/login.js"></script>
  <script src="../../frontend/general/js/reveal.js"></script>
  <script type= "module" src = "../js/auth.ClientApi.js"></script>
</body>
</html>
