<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — SZCUTZ</title>
    <link rel="stylesheet" href="../css/login.css" />
    <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

  <main class="login-page">
    <div class="login-card">
      <a href="../../frontend/home/html/home.html" class="brand">
           <img src="../../assets/logo_image/logo_refine_pro_max-removebg.png" alt="SZCUTZ" class="login-logo" />
      </a>
      <span class="eyebrow">Admin</span>
      <h1>Welcome Back</h1>
      <p class="login-subtext">Log in to manage bookings, services, and availability.</p>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Your username" required autocomplete="new-password" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="new-password" />
        </div>

        <div class="form-message" id="formMessage" role="alert" hidden></div>

        <button type="submit" class="btn btn-primary login-submit">Log In</button>
      </form>
    </div>
  </main>

  <script src="../js/login.js"></script>
  <script src="../../frontend/general/js/reveal.js"></script>
</body>
</html>
